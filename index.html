<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖤 A Special Wish For You</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- ✅ CSS FILE LINK -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg"></div>
<div class="bg-image"></div>
<div class="vignette"></div>
<div class="embers" id="embers"></div>

<!-- QUESTION SCREEN -->
<div class="card" id="questionScreen">
  <h1>Are you a friend of Umer?</h1>
  <p>This wish is reserved for someone special. Please confirm first 🖤</p>
  <div class="btn-group">
    <button class="btn-yes" onclick="showWish()">Yes, I am! 🔥</button>
    <button class="btn-no" onclick="wrongFriend(event)">No</button>
  </div>
</div>

<!-- WISH SCREEN -->
<div class="card" id="wishScreen">
  <div class="emoji">🎂</div>
  <h1 id="greeting">Happy Birthday, Umer!</h1>
  <p class="message" id="message">
    May your day be filled with laughter, love, and everything your heart desires.
    You deserve all the happiness in the world — today and always. 🌟
  </p>
  <p class="from" id="from">— With love, Your Bro Umer 🤝</p>
</div>

<!-- ✅ JS FILE LINK (body ke aakhir mein) -->
<script src="script.js"></script>
</body>
</html>
